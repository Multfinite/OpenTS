# Реестр идентификаторов правил проекта OpenTS. Читается HYAI/HYAI/tools/check_rules.py.
# Схема — HYAI/HYAI/core/kernel/spec/rule-ids.md. Здесь только машинные данные.
version: "1.0"

owners:
  HYAI: "ядро каркаса: правила, действующие в любом домене"
  KIT: "домен kit: расширение самого каркаса"
  SW: "домен software"
  DOC: "домен docs"
  NR: "домен narrative"
  PIC: "домен picture: промптовая генерация изображений, конвейеры звеньев и серии"
  VID: "домен video: временная связность, сегменты, звук, швы и монтаж"
  PRJ: "этот проект (OpenTS): проектные правила, включая чистый экспорт без HYAI"

classes:
  HYAI: [PERM-N, PERM-G, PERM-A, PERM-P, PERM-E, PERM-V, INT, ART, DEC, PROV]
  KIT: [POL, INV]
  SW: [POL, INV]
  DOC: [POL, TXT, INV]
  NR: [POL, TXT, ENT, CMP, EXP, READ, INV]
  PIC: [POL, SAF, PRM, ENV, WF, QA, INV]
  VID: [POL, WF, QA, INV]
  PRJ: [POL]

sources:
  - "HYAI/HYAI/core/kernel/policies/*.md"
  - "HYAI/HYAI/core/kernel/routing.md"
  - "HYAI/HYAI/core/domains/*/policy.md"
  - "HYAI/HYAI/core/domains/*/text.md"
  - "HYAI/HYAI/core/domains/*/access.md"
  - "HYAI/HYAI/core/domains/*/authority.md"
  - "meta/architecture/*.md"
  - "meta/policies/*.md"

reference_scope:
  - "HYAI/HYAI/core/**"
  - "meta/**"
  - "tools/*.py"
  - "AGENTS.md"
  - "CLAUDE.md"

ignore_references:
  - "KIT-..."       # плейсхолдер в описании классов: не ID, а образец формы

